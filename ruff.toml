# Ruff 配置 — 与 CI 工作流配套
# 基础规则（E4/E7/E9/F）+ import 排序/现代化/bugbear/异步/RUF
target-version = "py312"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
  "BLE001",   # 配置流程/API 边界有意使用宽泛异常捕获（沿用原仓库模式）
  "RUF001",   # 中文项目：字符串全角标点为有意为之
  "RUF002",   # 中文项目：docstring 全角标点为有意为之
  "RUF003",   # 中文项目：注释全角标点为有意为之
]

[lint.per-file-ignores]
"tests/test_sensor.py" = ["S110"]      # 独立函数副本保留原始写法
"scripts/verify_api.py" = ["ASYNC230", "ASYNC250"] # 独立交互脚本，同步 IO 无碍
"tests/conftest.py" = ["E402"]            # 先建 HA mock 再 import，顺序有意为之
